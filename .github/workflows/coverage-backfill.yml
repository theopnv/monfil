name: Coverage backfill

# Run by hand. Each tag writes about 730 rows to D1, and the free plan allows 100,000 a day,
# which resets at 00:00 UTC. Check the usage before a run of every tag.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: Tags to measure and upload, separated by spaces. Leave empty for every v* tag with tests.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: coverage-backfill
  cancel-in-progress: false

env:
  DEVANALYTICS_WORKER_URL: https://monfil-devanalytics.tpenavaire.workers.dev

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: list
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$tag is not a release tag such as v0.5.1."
              exit 1
            fi
          done
          if [ "${#tags[@]}" -eq 0 ]; then
            # v0.0.1 has no tests.
            mapfile -t tags < <(git tag --list 'v*' --sort=creatordate | grep -vx 'v0.0.1')
          fi
          echo "tags=$(printf '%s\n' "${tags[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  measure:
    needs: tags
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tag: ${{ fromJson(needs.tags.outputs.tags) }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          electron: 'true'
          electron-dependencies: 'true'
          chromium: 'true'

      # This job runs old code and holds no token. The final job uploads the snapshots.
      - name: Measure the tag
        env:
          TAG: ${{ matrix.tag }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/coverage/backfill.mts --dry-run --out-dir "$RUNNER_TEMP/snapshots" "$TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-snapshot-${{ matrix.tag }}
          path: ${{ runner.temp }}/snapshots/
          if-no-files-found: error
          retention-days: 2

  ingest:
    needs: measure
    if: ${{ !cancelled() && needs.measure.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check ingest credential
        env:
          DEVANALYTICS_INGEST_TOKEN: ${{ secrets.DEVANALYTICS_INGEST_TOKEN }}
        run: |
          if [ -z "$DEVANALYTICS_INGEST_TOKEN" ]; then
            echo "::error::Set the DEVANALYTICS_INGEST_TOKEN secret to the Worker's INGEST_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            scripts/coverage
            scripts/devanalytics
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-snapshot-*
          path: ${{ runner.temp }}/snapshots

      # One at a time, oldest first, so that one ingest batch is in flight.
      - name: Upload the snapshots
        env:
          DEVANALYTICS_INGEST_TOKEN: ${{ secrets.DEVANALYTICS_INGEST_TOKEN }}
        run: |
          while IFS= read -r file; do
            echo "$file"
            node scripts/coverage/ingest.mts "$file"
          done < <(find "$RUNNER_TEMP/snapshots" -name '*.json' | sort -V)
