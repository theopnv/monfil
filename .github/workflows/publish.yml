name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version, expected $expected"
            exit 1
          fi

  test:
    needs: check_version
    uses: ./.github/workflows/test.yml
    with:
      full_matrix: true
      upload_package: true
    secrets: inherit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && vars.APPLE_SIGNING_IDENTITY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package-${{ matrix.os }}

      - name: Restore app package
        shell: bash
        run: tar -xf packaged-app.tar

      - if: env.APPLE_SIGNING_IDENTITY != ''
        uses: ./.github/actions/apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY_P8 }}

      # The e2e job signs the app but leaves notarization here, so a slow Apple queue does not hold up the tests.
      - name: Notarize the app
        if: env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          apps=$(find out -maxdepth 2 -name '*.app' -type d)
          if [ "$(printf '%s\n' "$apps" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected one app bundle, found: $apps"
            exit 1
          fi
          ditto -c -k --keepParent "$apps" "$RUNNER_TEMP/notarize-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-app.zip" --wait \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "$apps"

      - run: npm run make -- --skip-package

      # Apple asks for the outer disk image to be signed and notarized too.
      - name: Sign and notarize the disk image
        if: env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          images=$(find out/make -name '*.dmg')
          if [ "$(printf '%s\n' "$images" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected one disk image, found: $images"
            exit 1
          fi
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$images"
          xcrun notarytool submit "$images" --wait \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "$images"

      # The unsigned MSIX only installs through the Store, so it stays out of the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.os }}
          path: |
            out/make/
            !out/make/msix/
          if-no-files-found: error
          overwrite: true
          retention-days: 2

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-package
          path: out/make/msix/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: release-artifacts

      - name: Publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' installers < <(find release-artifacts -type f -print0)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No installers were downloaded."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${installers[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "${installers[@]}" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

  # Every Store submission goes through certification, so only minor and major releases go to the Store.
  store:
    needs: publish
    if: vars.MSSTORE_PRODUCT_ID != '' && endsWith(github.ref_name, '.0')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-package
          path: store-package

      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Submit to the Microsoft Store
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @(Get-ChildItem -Path store-package -Recurse -Filter *.msix)
          if ($packages.Count -ne 1) {
            Write-Output "::error::Expected one MSIX package, found $($packages.Count)."
            exit 1
          }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          # Partner Center keeps one submission at a time, and publish cannot replace one that is already in review.
          $current = msstore submission get $env:PRODUCT_ID | Out-String | ConvertFrom-Json
          $inReview = @('CommitStarted', 'PreProcessing', 'Certification', 'Release', 'PendingPublication', 'Publishing')
          if ($inReview -contains $current.status) {
            Write-Output "::notice::Skipped the Store submission because submission $($current.id) is in status $($current.status). The next minor release will carry this version."
            exit 0
          }
          if ($current.status -eq 'PendingCommit' -and -not $current.fileUploadUrl) {
            Write-Output "::error::Submission $($current.id) is a draft that was started in Partner Center. The Store CLI cannot replace it. Delete the draft in Partner Center, then rerun this job."
            exit 1
          }
          msstore publish $packages[0].FullName --appId $env:PRODUCT_ID
