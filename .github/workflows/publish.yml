name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # windows-latest's node-gyp can't detect the Visual Studio version on this image yet,
        # which breaks the better-sqlite3 native rebuild. Pinned until @electron/node-gyp catches up.
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: npx vite build --config vite.renderer.config.mts

      - run: npm run lint

      - run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
