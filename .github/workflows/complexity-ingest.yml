name: Complexity ingest

# A workflow of its own, so a failed upload never blocks tests, versioning or releases.
on:
  push:
    branches: [main]
    # Release commits change only package.json, so they add no new snapshot.
    paths:
      - 'src/**'
      - 'scripts/complexity/**'

permissions:
  contents: read

concurrency:
  group: complexity-ingest
  cancel-in-progress: false

env:
  DEVANALYTICS_WORKER_URL: https://monfil-devanalytics.tpenavaire.workers.dev

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check ingest credential
        env:
          DEVANALYTICS_INGEST_TOKEN: ${{ secrets.DEVANALYTICS_INGEST_TOKEN }}
        run: |
          if [ -z "$DEVANALYTICS_INGEST_TOKEN" ]; then
            echo "::error::Set the DEVANALYTICS_INGEST_TOKEN secret to the Worker's INGEST_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npm run complexity -- --out "$RUNNER_TEMP/snapshot.json"

      - env:
          DEVANALYTICS_INGEST_TOKEN: ${{ secrets.DEVANALYTICS_INGEST_TOKEN }}
        run: npm run complexity:ingest -- "$RUNNER_TEMP/snapshot.json"
