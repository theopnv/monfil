name: Complexity ingest

# A workflow of its own, so a failed upload never blocks tests, versioning or releases.
on:
  push:
    branches: [main]
    # Release commits change only package.json, so they add no new snapshot.
    paths:
      - 'src/**'
      - '.github/workflows/complexity-ingest.yml'

permissions:
  contents: read

concurrency:
  group: complexity-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: theopnv/devanalytics/action@v0.0.1
        with:
          metric: complexity
          worker-url: ${{ vars.DEVANALYTICS_URL }}
          token: ${{ secrets.DEVANALYTICS_INGEST_TOKEN }}
          include: |
            src/**/*.{ts,tsx}
          test-pattern: |
            **/*.test.{ts,tsx}
          cognitive-limit: 15
          cyclomatic-limit: 10
