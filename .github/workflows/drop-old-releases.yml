name: Drop old releases

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: drop-old-releases
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete drafts and all but the two newest releases and pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s -r '
            add
            | (map(select(.draft)))
              + (map(select(.draft | not) | select(.prerelease | not)) | sort_by(.created_at) | reverse | .[2:])
              + (map(select(.draft | not) | select(.prerelease)) | sort_by(.created_at) | reverse | .[2:])
            | .[] | "\(.id) \(.tag_name)"
          ' | while read -r id tag; do
            echo "Deleting release $tag"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
