name: Complexity comment

# Runs from the default branch with a write token. It must never check out or run code from the PR:
# the artifact comes from complexity.yml, which ran the PR's code, so all of it is untrusted input.
on:
  workflow_run:
    workflows: [Complexity]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Downloading an artifact from another run needs actions: read.
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/actions
            scripts/complexity
            scripts/devanalytics
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: complexity-report
          path: ${{ runner.temp }}/report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: pr
        uses: ./.github/actions/check-pr-artifact
        with:
          directory: ${{ runner.temp }}/report
          head-sha: ${{ github.event.workflow_run.head_sha }}
          token: ${{ github.token }}

      - name: Render the comment
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          diff_head_sha="$(jq -r .head_sha "$RUNNER_TEMP/report/diff.json")"
          if [ "$diff_head_sha" != "$RUN_HEAD_SHA" ]; then
            echo "::error::The diff is for $diff_head_sha, but the run measured $RUN_HEAD_SHA."
            exit 1
          fi
          node scripts/complexity/report.mts render "$RUNNER_TEMP/report/diff.json" --out "$RUNNER_TEMP/comment.md"

      - uses: ./.github/actions/post-pr-comment
        with:
          number: ${{ steps.pr.outputs.number }}
          marker: '<!-- complexity-report -->'
          body-file: ${{ runner.temp }}/comment.md
          token: ${{ github.token }}
