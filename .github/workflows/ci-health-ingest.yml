name: CI health ingest

# Stores the timings and test results of each finished Test and Publish run.
# It runs from the default branch with the ingest secret. The report artifacts come from the run's own code, so all of them
# are untrusted input: the Action only parses them as data and never runs anything from them.
on:
  workflow_run:
    workflows: [Test, Publish]
    types: [completed]

permissions: {}

concurrency:
  group: ci-health-ingest-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      # Reading the jobs and the logs of another run needs actions: read.
      actions: read
    steps:
      - uses: theopnv/devanalytics/action@v0.0.1
        with:
          metric: ci
          worker-url: ${{ vars.DEVANALYTICS_URL }}
          token: ${{ secrets.DEVANALYTICS_INGEST_TOKEN }}
          github-token: ${{ github.token }}

  tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # A run that skipped its tests uploaded no report, and the run is still worth recording for its timings.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: ci-report-${{ github.event.workflow_run.run_attempt }}-*
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The tests metric names the runner after the folder, so the folder drops the prefix and keeps the suite and the system.
      - name: Name each folder after its suite and runner
        env:
          PREFIX: reports/ci-report-${{ github.event.workflow_run.run_attempt }}-
        run: |
          mkdir -p reports
          shopt -s nullglob
          for dir in "$PREFIX"*; do
            mv "$dir" "reports/${dir#"$PREFIX"}"
          done

      - uses: theopnv/devanalytics/action@v0.0.1
        with:
          metric: tests
          worker-url: ${{ vars.DEVANALYTICS_URL }}
          token: ${{ secrets.DEVANALYTICS_INGEST_TOKEN }}
          working-directory: reports
          reports: |
            unit=unit.json
            integration=integration.json
            e2e=e2e.json
