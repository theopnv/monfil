name: Test

on:
  pull_request:
    # Any base branch, so each PR of a stack gets its own run.
    branches: ['**']
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  workflow_call:
    inputs:
      full_matrix:
        description: Run the unit and e2e jobs on every platform, whatever event triggered the caller.
        type: boolean
        default: false
      upload_package:
        description: Save each successful e2e job's app package for the installer jobs.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        uses: ./.github/actions/changes

      - uses: ./.github/actions/setup

      - name: Check PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - if: steps.changes.outputs.code == 'true'
        run: npm run lint

      - if: steps.changes.outputs.code == 'true'
        run: npx vitest --run --project node eslint.config.test.ts

      # Check that pack metadata matches its OPML sources.
      - if: steps.changes.outputs.code == 'true'
        run: npm run check:feedpacks

      # Check that every translation matches the English text it was made from.
      - if: steps.changes.outputs.code == 'true'
        run: npm run i18n:check

      - if: steps.changes.outputs.docs == 'true'
        run: npm run lint:docs

      - if: steps.changes.outputs.docs == 'true'
        run: npm ci --prefix doc

      - if: steps.changes.outputs.docs == 'true'
        run: npm --prefix doc run build

      # Check that no translated docs page is missing or older than its English source.
      - if: steps.changes.outputs.docs == 'true'
        run: npm --prefix doc run check:translations

  os_matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.compute.outputs.os }}
    steps:
      # A plain pull_request run only ever gets ubuntu-latest, to keep the expensive macOS/Windows
      # legs off every commit. The "full-ci" label opts a PR in: labeling triggers a pull_request
      # event, so the resulting checks are tied to the PR's own check suite and can actually satisfy
      # the branch ruleset's required checks (a workflow_dispatch run's checks are not).
      #
      # A tag push reaches this workflow through publish.yml as a plain "push" event, which would
      # land in the ubuntu-only branch below. publish.yml passes full_matrix so a release is tested
      # on every platform it ships to.
      - id: compute
        run: |
          full='["ubuntu-24.04", "macos-latest", "macos-15-intel", "windows-latest"]'
          if [ "${{ inputs.full_matrix }}" = "true" ]; then
            echo "os=$full" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" = "true" ]; then
            echo "os=$full" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo "os=$full" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: os_matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.os_matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        uses: ./.github/actions/changes

      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup
        with:
          electron: 'true'

      - if: steps.changes.outputs.code == 'true'
        run: npm run test:unit -- --reporter=default --reporter=./scripts/ci/vitest-reporter.mts
        env:
          SKIP_LINT_RULE_TESTS: 'true'
          MONFIL_CI_REPORT: test-reports/unit.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        with:
          name: ci-report-${{ github.run_attempt }}-unit-${{ matrix.os }}
          path: test-reports/unit.json
          if-no-files-found: ignore
          retention-days: 2

  integration:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        uses: ./.github/actions/changes

      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup
        with:
          chromium: 'true'

      - if: steps.changes.outputs.code == 'true'
        run: npm run test:integration -- --reporter=default --reporter=./scripts/ci/vitest-reporter.mts
        env:
          MONFIL_CI_REPORT: test-reports/integration.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        with:
          name: ci-report-${{ github.run_attempt }}-integration-ubuntu-latest
          path: test-reports/integration.json
          if-no-files-found: ignore
          retention-days: 2

  e2e:
    needs: [lint, os_matrix]
    runs-on: ${{ matrix.os }}
    # The e2e step packages the app, and a release ships that package, so the release build takes its analytics key here.
    env:
      MONFIL_APTABASE_KEY: ${{ inputs.upload_package && vars.MONFIL_APTABASE_KEY || '' }}
      MONFIL_APTABASE_HOST: ${{ inputs.upload_package && vars.MONFIL_APTABASE_HOST || '' }}
      # Packaging signs the release app, so only a release run on macOS gets the Apple identity.
      APPLE_SIGNING_IDENTITY: ${{ inputs.upload_package && startsWith(matrix.os, 'macos') && vars.APPLE_SIGNING_IDENTITY || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.os_matrix.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        uses: ./.github/actions/changes

      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup
        with:
          electron: 'true'
          electron-dependencies: 'true'

      - if: env.APPLE_SIGNING_IDENTITY != ''
        uses: ./.github/actions/apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # xvfb-run defaults to a 640x480 screen, and the maximized app window would follow it.
      - if: steps.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e -- --reporter=dot,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-reports/e2e.json

      - if: steps.changes.outputs.code == 'true' && runner.os != 'Linux'
        run: npm run test:e2e -- --reporter=dot,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-reports/e2e.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        with:
          name: ci-report-${{ github.run_attempt }}-e2e-${{ matrix.os }}
          path: test-reports/e2e.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Archive app package
        if: inputs.upload_package
        shell: bash
        run: tar -cf packaged-app.tar out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.upload_package
        with:
          name: package-${{ matrix.os }}
          path: packaged-app.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' }}
        with:
          name: test-result-${{ matrix.os }}
          path: test-results/
          retention-days: 2
