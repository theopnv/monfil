name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # tsc needs routeTree.gen.ts, which the router plugin only writes as a build side effect.
      - run: npx vite build --config vite.renderer.config.mts

      - run: npm run lint

  os_matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.compute.outputs.os }}
    steps:
      # windows-latest ships Visual Studio 2026, which the @electron/node-gyp version bundled by
      # our pinned Electron Forge release can't detect, so better-sqlite3 fails to build.
      # Pin to windows-2022 until theopnv/monfil#41 is resolved.
      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest", "macos-latest", "windows-2022"]' >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: os_matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.os_matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install

      - run: npm run test:integration

  e2e:
    needs: [lint, unit, integration, os_matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.os_matrix.outputs.os) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install

      - if: runner.os == 'Linux'
        run: npx playwright install-deps

      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - if: runner.os != 'Linux'
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-result-${{ matrix.os }}
          path: test-results/
          retention-days: 2
