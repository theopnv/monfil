name: Setup
description: >
  Installs Node and project dependencies. Optionally installs Electron, Chromium, and
  Linux libraries needed to launch them.

inputs:
  node-version:
    description: Node.js version to install
    default: '24'
  electron:
    description: Cache and install the Electron binary
    default: 'false'
  electron-dependencies:
    description: Install Linux system dependencies for launching Electron
    default: 'false'
  chromium:
    description: Cache and install Chromium for headless browser tests
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # Resolved from package-lock.json rather than package.json so the cache key tracks the exact
    # version npm ci will install, not just the semver range.
    - name: Resolve pinned versions
      id: versions
      shell: bash
      run: |
        echo "electron=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"
        echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

    # @electron/get has no env var to redirect this; it always resolves to env-paths('electron').cache,
    # which differs by OS. Listing all three candidate paths lets one cache step cover every runner.
    - name: Cache Electron download
      if: inputs.electron == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
        key: electron-${{ runner.os }}-${{ steps.versions.outputs.electron }}

    - name: Cache Chromium headless shell
      if: inputs.chromium == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: chromium-headless-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.playwright }}

    - run: npm ci
      shell: bash

    - name: Install Linux system dependencies
      if: runner.os == 'Linux' && (inputs.electron-dependencies == 'true' || inputs.chromium == 'true')
      run: npx playwright install-deps chromium
      shell: bash

    - name: Install Linux Electron libraries
      if: runner.os == 'Linux' && inputs.electron-dependencies == 'true'
      run: sudo apt-get install --yes --no-install-recommends libgtk-3-0t64 libx11-xcb1 libxss1
      shell: bash

    - name: Install Electron binary
      if: inputs.electron == 'true'
      run: node node_modules/electron/install.js
      shell: bash

    - name: Install Chromium headless shell
      if: inputs.chromium == 'true'
      run: npx playwright install chromium --only-shell
      shell: bash
